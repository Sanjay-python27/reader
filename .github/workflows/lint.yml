name: Sanjay - GitHub Actions Learning

on:
  pull_request:
    branches:
      - github-actions-tutorial
      - master

  push:
    branches:
      - github-actions-tutorial

  workflow_dispatch:

jobs:
  linting-check:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello Sanjay! My first GitHub Action is running."

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff
        run: ruff check .

  tests:
    name: Run Tests
    needs: linting-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Run Pytest
        run: pytest